<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="방꾸요정 로고 — 창문">
  <!-- 1안 '창문' — 방의 가장 보편적 상징. 햇살이 드는 창 = 방꾸의 시작. 아이콘이 작아져도 격자가 살아남는다. -->
  <defs>
    <linearGradient id="w-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8C7B2"/><stop offset="1" stop-color="#835151"/>
    </linearGradient>
    <linearGradient id="w-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3E4"/><stop offset="1" stop-color="#FFD9A8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#w-bg)"/>
  <rect x="132" y="108" width="248" height="268" rx="24" fill="#FFF8F3"/>
  <rect x="156" y="132" width="200" height="220" rx="12" fill="url(#w-sky)"/>
  <circle cx="306" cy="186" r="30" fill="#FFC46B"/>
  <rect x="248" y="132" width="16" height="220" fill="#FFF8F3"/>
  <rect x="156" y="234" width="200" height="16" fill="#FFF8F3"/>
  <rect x="112" y="376" width="288" height="22" rx="11" fill="#FFF8F3"/>
  <!-- 창턱의 작은 화분 — '꾸민 방'을 한 점으로 -->
  <path d="M236 376v-26h40v26z" fill="#C9755F"/>
  <path d="M256 350c0-22 14-34 30-34-2 20-14 32-30 34z" fill="#7BA05B"/>
</svg>
