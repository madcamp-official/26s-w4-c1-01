<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="방꾸요정 — 요정 지팡이">
  <!-- 5안 '요정 지팡이' — 앱의 말투(요정이 대신 놓아준다)를 가장 직접 말한다.
       대각선 하나로 시선을 끌고, 지나간 자리에 반짝임이 흩어진다. -->
  <rect width="512" height="512" fill="#835151"/>
  <g transform="rotate(-40 256 256)">
    <!-- 손잡이(굵게) → 대(가늘게): 지팡이로 읽히게 두 단으로 -->
    <rect x="238" y="268" width="36" height="112" rx="18" fill="#D9A793"/>
    <rect x="244" y="196" width="24" height="86" rx="12" fill="#FFF8F3"/>
  </g>
  <!-- 끝의 큰 반짝임 -->
  <path d="M318 154c13 50 30 67 80 80-50 13-67 30-80 80-13-50-30-67-80-80 50-13 67-30 80-80z" fill="#FFF8F3"/>
  <!-- 흩날리는 작은 반짝임 -->
  <path d="M176 316c5 20 11 26 31 31-20 5-26 11-31 31-5-20-11-26-31-31 20-5 26-11 31-31z" fill="#D9A793"/>
  <path d="M136 226c4 15 8 19 23 23-15 4-19 8-23 23-4-15-8-19-23-23 15-4 19-8 23-23z" fill="#D9A793" opacity=".75"/>
</svg>
