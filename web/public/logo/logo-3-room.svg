<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="방꾸요정 로고 — 평면도">
  <!-- 3안 '평면도' — 이 앱의 본질(실치수 배치). 위에서 본 방과 가구 배치. 가장 도구답고 신뢰감이 있다. -->
  <defs>
    <linearGradient id="p-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8C5A5A"/><stop offset="1" stop-color="#5E3A3A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#p-bg)"/>
  <!-- 방 윤곽(L자 — 실제 원룸처럼 욕실이 파인 형태) -->
  <path d="M104 112h304v152h-88v136H104z" fill="#FFF8F3"/>
  <!-- 침대 -->
  <rect x="136" y="150" width="120" height="88" rx="10" fill="#E8A48C"/>
  <rect x="136" y="150" width="120" height="26" rx="10" fill="#C9755F"/>
  <!-- 책상 + 의자 -->
  <rect x="288" y="150" width="88" height="40" rx="8" fill="#B98A6A"/>
  <circle cx="332" cy="212" r="17" fill="#7BA05B"/>
  <!-- 러그 -->
  <rect x="136" y="278" width="130" height="86" rx="14" fill="#F0DCC8"/>
  <!-- 문 열림 호 -->
  <path d="M104 400v-64a64 64 0 0 1 64 64z" fill="none" stroke="#C9BBA8" stroke-width="12"/>
</svg>
