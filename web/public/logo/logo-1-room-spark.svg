<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="방꾸요정 — 반짝이는 방">
  <!-- 1안 '반짝이는 방' — 앱 이름 그대로 '방'(둥근 사각 윤곽) + '요정'(반짝임).
       바탕은 브랜드 브라운, 마크는 앱 배경색. 홈 화면에서 존재감이 가장 크다. -->
  <rect width="512" height="512" fill="#835151"/>
  <!-- 방: 앱 카드와 같은 라운드 비율(20/ 512 ≈ 카드감), 선으로만 -->
  <rect x="118" y="118" width="276" height="276" rx="58" fill="none" stroke="#FFF8F3" stroke-width="26"/>
  <!-- 요정 반짝임: 4각 별 하나 크게, 하나 작게 -->
  <path d="M256 168c12 54 30 72 84 84-54 12-72 30-84 84-12-54-30-72-84-84 54-12 72-30 84-84z" fill="#FFF8F3"/>
  <path d="M348 300c5 23 13 31 36 36-23 5-31 13-36 36-5-23-13-31-36-36 23-5 31-13 36-36z" fill="#D9A793"/>
</svg>
